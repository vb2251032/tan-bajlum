<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-es="Acceso - T'an Bajlum" data-en="Access - T'an Bajlum">Acceso - T'an Bajlum</title>
    <!-- Google Fonts para la tipografía formal y elegante -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tu hoja de estilos en la raíz -->
    <link rel="stylesheet" href="style.css">
    <!-- Script para aplicar el idioma guardado antes de que cargue la página (evita parpadeos) -->
    <script>
        (function() {
            const idiomaGuardado = localStorage.getItem('idioma_seleccionado') || 'es';
            if (idiomaGuardado === 'en') {
                document.addEventListener('DOMContentLoaded', () => aplicarTraduccion('en'));
            }
        })();
    </script>
</head>
<body class="body-acceso">

    <!-- Superposición para oscurecer suavemente la imagen de fondo -->
    <div class="overlay-fondo"></div>

    <!-- BOTÓN DE CAMBIO DE IDIOMA (Esquina superior derecha) -->
    <div class="selector-idioma">
        <button id="btn-es" class="lang-btn activo" onclick="cambiarIdioma('es')">ES</button>
        <span class="separador-lang">|</span>
        <button id="btn-en" class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
    </div>

    <div class="layout-portal">
        <!-- Encabezado sutil del portal -->
        <header class="encabezado">
            <span class="badge-tag" data-es="Audioguías QR" data-en="QR Audio Guides">Audioguías QR</span>
            <h1 id="titulo-principal" data-es="T'an Bajlum" data-en="T'an Bajlum">T'an Bajlum</h1>
            <p class="subtitulo" data-es="PARQUE-MUSEO LA VENTA" data-en="LA VENTA PARK-MUSEUM">PARQUE-MUSEO LA VENTA</p>
            <div class="linea-decorativa"></div>
        </header>

        <!-- Contenedor central del portal de acceso -->
        <main class="contenedor-acceso">
            <div class="tarjeta-audio caja-login">
                <h2 data-es="Portal de Visitantes" data-en="Visitors Portal">Portal de Visitantes</h2>
                <p class="texto-bienvenida" 
                   data-es="Bienvenido al sistema interactivo de audioguías de T'an Bajlum. Ingresa tu nombre para personalizar tu recorrido o entra directamente." 
                   data-en="Welcome to the T'an Bajlum interactive audio guide system. Enter your name to personalize your tour or enter directly.">
                    Bienvenido al sistema interactivo de audioguías de T'an Bajlum. 
                    Ingresa tu nombre para personalizar tu recorrido o entra directamente.
                </p>

                <!-- Formulario interactivo -->
                <form action="paginas/index-principal.html" method="GET">
                    <div class="campo-input">
                        <input type="text" name="nombre" id="input-nombre" placeholder="Tu nombre (opcional)" data-placeholder-es="Tu nombre (opcional)" data-placeholder-en="Your name (optional)" autocomplete="off">
                    </div>
                    <button type="submit" class="btn-ingresar">
                        <span data-es="Iniciar Recorrido" data-en="Start Tour">Iniciar Recorrido</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- SCRIPT ÚNICO PARA CAMBIAR EL IDIOMA DINÁMICAMENTE -->
    <script>
        // Función unificada que traduce textos y placeholders
        function aplicarTraduccion(idioma) {
            // Actualizar clases activas en los botones de idioma
            const btnEs = document.getElementById('btn-es');
            const btnEn = document.getElementById('btn-en');
            if (btnEs && btnEn) {
                btnEs.classList.toggle('activo', idioma === 'es');
                btnEn.classList.toggle('activo', idioma === 'en');
            }

            // Traducir todos los elementos que tengan atributos data-es / data-en
            const elementos = document.querySelectorAll('[data-es]');
            elementos.forEach(el => {
                if (idioma === 'en') {
                    el.innerHTML = el.getAttribute('data-en');
                } else {
                    el.innerHTML = el.getAttribute('data-es');
                }
            });

            // Traducir el placeholder del input de forma específica
            const inputNombre = document.getElementById('input-nombre');
            if (inputNombre) {
                if (idioma === 'en') {
                    inputNombre.placeholder = inputNombre.getAttribute('data-placeholder-en');
                } else {
                    inputNombre.placeholder = inputNombre.getAttribute('data-placeholder-es');
                }
            }
        }

        // Función que ejecuta el cambio al hacer clic en los botones
        function cambiarIdioma(idioma) {
            localStorage.setItem('idioma_seleccionado', idioma);
            aplicarTraduccion(idioma);
        }

        // Cargar el idioma guardado previamente al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            const idiomaGuardado = localStorage.getItem('idioma_seleccionado') || 'es';
            aplicarTraduccion(idiomaGuardado);
        });
    </script>

</body>
</html>
